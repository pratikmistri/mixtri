<!--
  Design source for the per-zoom-segment camera drift icon.

  A viewfinder (four corner brackets) with the camera gliding along a tapered arc:
  the arc thins out behind the moving dot, which is what separates "the shot slowly
  drifts" from a rotate/refresh arrow.

  This file is the editable source of truth. The SAME path data is used at runtime by
  the PathIcon in EditorPage.xaml (ZoomDriftToggle) rather than loading this SVG: a
  PathIcon inherits the button's Foreground, so it follows the theme and the toggle's
  hover/pressed/checked visual states, which a fixed-fill SvgImageSource cannot. Keep
  the two in sync if the shape changes.

  Authored on a 20x20 grid, filled (not stroked) with fill-rule evenodd, to match how
  PathIcon renders geometry.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <path fill="#E6E6E6" fill-rule="evenodd" d="M2,7.5 L2,3.5 A1.5,1.5 0 0 1 3.5,2 L7.5,2 L7.5,3.4 L3.4,3.4 L3.4,7.5 Z M18,7.5 L18,3.5 A1.5,1.5 0 0 0 16.5,2 L12.5,2 L12.5,3.4 L16.6,3.4 L16.6,7.5 Z M2,12.5 L2,16.5 A1.5,1.5 0 0 0 3.5,18 L7.5,18 L7.5,16.6 L3.4,16.6 L3.4,12.5 Z M18,12.5 L18,16.5 A1.5,1.5 0 0 1 16.5,18 L12.5,18 L12.5,16.6 L16.6,16.6 L16.6,12.5 Z M4.40,11.50 A6.6,6.6 0 0 1 14.07,9.80 L12.36,10.82 A5.3,5.3 0 0 0 4.61,12.19 Z M12.88,11.30 A1.6,1.6 0 1 0 16.08,11.30 A1.6,1.6 0 1 0 12.88,11.30 Z"/>
</svg>
