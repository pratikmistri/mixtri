name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build export worker
        run: msbuild src\Mixtri.App\Mixtri.App.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifiers=win-x64 /v:minimal

      - name: Restore dependencies
        run: dotnet restore src/Mixtri.Tests/Mixtri.Tests.csproj

      - name: Build
        run: msbuild src/Mixtri.Tests/Mixtri.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /t:Build /v:minimal

      - name: Run tests
        env:
          MIXTRI_TEST_WORKER_PATH: '${{ github.workspace }}\src\Mixtri.App\bin\x64\Release\net9.0-windows10.0.26100.0\win-x64\Mixtri.App.exe'
          MIXTRI_TEST_SOFTWARE_RENDERING: '1'
        run: dotnet test src/Mixtri.Tests/Mixtri.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/Mixtri.Tests/TestResults/*.trx
